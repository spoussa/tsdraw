<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TSDraw harness</title>
<style>
  body { margin: 0; background: #1c2537; font-family: sans-serif; color: #ccc; }
  /* Mimics TeamSpeak's stream tile: a flex box with an object-fit:contain video. */
  .stream__video { position: absolute; left: 40px; top: 40px; width: 900px; height: 640px; background: #000; }
  .video-stream { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  video { width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<div class="stream__video"><div class="video-stream" id="host"><video id="v" autoplay muted></video></div></div>
<canvas id="src" width="1920" height="1080" style="display:none"></canvas>
<script>
  // Fake "remote screen": a moving gradient so the video has a real 16:9 frame.
  const src = document.getElementById("src"), sctx = src.getContext("2d");
  let t = 0;
  (function paint() {
    t += 1;
    const g = sctx.createLinearGradient(0, 0, 1920, 1080);
    g.addColorStop(0, "#2d3b55"); g.addColorStop(1, "#46607f");
    sctx.fillStyle = g; sctx.fillRect(0, 0, 1920, 1080);
    sctx.fillStyle = "#e8eef7"; sctx.font = "bold 72px sans-serif";
    sctx.fillText("Streamer's screen " + (t % 100), 120, 200);
    for (let i = 0; i <= 1920; i += 240) { sctx.fillStyle = "#6b84a8"; sctx.fillRect(i, 0, 2, 1080); }
    for (let j = 0; j <= 1080; j += 270) { sctx.fillStyle = "#6b84a8"; sctx.fillRect(0, j, 1920, 2); }
    requestAnimationFrame(paint);
  })();
  document.getElementById("v").srcObject = src.captureStream(30);

  const SID = "11111111-2222-3333-4444-555555555555";
  document.getElementById("host").__vue__ = { session: { isInbound: true, idData: { scHandlerId: 1, serverSessionId: SID, clientId: 42 } }, $parent: null };
  window.tsclient_internal = {
    postMessage(msg, cb) {
      if (msg.cmd === "requestAllSessions") cb({ err: 0, payload: { inbound: [{ idData: { scHandlerId: 1, serverSessionId: SID, clientId: 42 } }], outbound: [] } });
    },
  };
  window.sent = [];
  window.__tsdrawSend = (s) => window.sent.push(JSON.parse(s));
</script>
<script src="../src/mod.js"></script>
</body>
</html>
